<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ez Voice</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><span class="brand">ez / voice</span><span class="badge">VOICE</span></header>
<h1>Talk to your agent.</h1><p id="identity">Connecting to your agent…</p>
<section class="call"><div id="orb" aria-hidden="true">◉</div><p id="status" role="status">Ready when you are.</p><div class="buttons"><button id="start">Start talking</button><button id="new">New conversation</button><button id="mute" disabled>Mute</button><button id="stop" disabled>End</button></div><audio id="audio" autoplay controls></audio></section>
<div class="columns"><section><h2>Conversation</h2><p class="hint">Text is retained privately for resume. Your voice and requested context go to OpenAI.</p><div id="transcript" aria-live="polite"></div></section><section><h2>Agent tools</h2><p class="hint">Workspace context and installed plugins.</p><div id="tools"></div><div id="activity" aria-live="polite"></div></section></div>
<footer>Private owner session · 20-minute call limit</footer></main><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/app.js" type="module"></script></body></html>
